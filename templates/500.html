{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-content">
        <div class="error-code">500</div>
        <h1 class="glitch-text" data-text=">_ SERVER_ERROR">>_ SERVER_ERROR</h1>
        <p class="error-message">System encountered an internal error. Please try again later.</p>
        <div class="terminal-line">
            <span class="prompt">$</span>
            <span class="typed-text">systemctl restart --force</span>
        </div>
        <a href="{{ url_for('home') }}" class="btn" style="margin-top: 30px;">
            <i class="fas fa-terminal"></i> REBOOT SYSTEM
        </a>
    </div>
</div>
{% endblock %}
