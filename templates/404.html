{% extends "base.html" %}

{% block title %}404 - Not Found{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-content">
        <div class="error-code">404</div>
        <h1 class="glitch-text" data-text=">_ SYSTEM_ERROR">>_ SYSTEM_ERROR</h1>
        <p class="error-message">The requested file could not be found in the system.</p>
        <div class="terminal-line">
            <span class="prompt">$</span>
            <span class="typed-text">cd .. && return home</span>
        </div>
        <a href="{{ url_for('home') }}" class="btn" style="margin-top: 30px;">
            <i class="fas fa-terminal"></i> RETURN TO HOME
        </a>
    </div>
</div>
{% endblock %}
