{% extends "base.html" %}

{% block content %}
<div class="page-container" id="contact-page">

    <div class="page-header">
        <h2 class="page-title glitch-text" data-text="CONTACT.exe">CONTACT.exe</h2>
        <div class="page-title-line"></div>
        <p class="page-subtitle">// Establish a secure communication channel</p>
    </div>

    <div class="contact-layout">

        <!-- Left: Signal Info -->
        <div class="contact-info-panel">
            <div class="ci-header">
                <i class="fas fa-satellite-dish"></i>
                <span>SIGNAL CHANNELS</span>
            </div>
            <div class="ci-body">
                <a href="https://github.com/PrajwalK01" target="_blank" class="channel-item">
                    <div class="channel-icon"><i class="fab fa-github"></i></div>
                    <div class="channel-text">
                        <span class="ch-label">GitHub</span>
                        <span class="ch-value">PrajwalK01</span>
                    </div>
                    <i class="fas fa-arrow-right ch-arrow"></i>
                </a>
                <a href="https://linkedin.com/in/prajwal" target="_blank" class="channel-item">
                    <div class="channel-icon"><i class="fab fa-linkedin"></i></div>
                    <div class="channel-text">
                        <span class="ch-label">LinkedIn</span>
                        <span class="ch-value">Prajwal K</span>
                    </div>
                    <i class="fas fa-arrow-right ch-arrow"></i>
                </a>
                <a href="mailto:prajwal.k@abhyudayakkss.org" class="channel-item">
                    <div class="channel-icon"><i class="fas fa-envelope"></i></div>
                    <div class="channel-text">
                        <span class="ch-label">Email</span>
                        <span class="ch-value">prajwal.k@...</span>
                    </div>
                    <i class="fas fa-arrow-right ch-arrow"></i>
                </a>
            </div>
            <div class="ci-status">
                <span class="status-dot pulse"></span>
                <span>Systems operational — response within 24h</span>
            </div>
        </div>

        <!-- Right: Form -->
        <div class="contact-form-panel">
            <div class="form-terminal-bar">
                <span class="tdot red"></span>
                <span class="tdot yellow"></span>
                <span class="tdot green"></span>
                <span class="form-terminal-title">transmission.sh</span>
            </div>
            <form action="https://formspree.io/f/your-form-id" method="POST" class="contact-form-3d" id="contact-form">
                <div class="form-field">
                    <label class="field-label"><span class="field-cmd">$</span> sender_name:</label>
                    <input type="text" name="name" class="field-input" placeholder="Your name" required autocomplete="off">
                    <div class="field-underline"></div>
                </div>
                <div class="form-field">
                    <label class="field-label"><span class="field-cmd">$</span> sender_email:</label>
                    <input type="email" name="email" class="field-input" placeholder="your@email.com" required autocomplete="off">
                    <div class="field-underline"></div>
                </div>
                <div class="form-field">
                    <label class="field-label"><span class="field-cmd">$</span> message_payload:</label>
                    <textarea name="message" class="field-input field-textarea" rows="5" placeholder="Your message..." required></textarea>
                    <div class="field-underline"></div>
                </div>
                <button type="submit" class="submit-btn-3d" id="submit-btn">
                    <span class="submit-btn-inner">
                        <i class="fas fa-paper-plane"></i>
                        TRANSMIT SIGNAL
                    </span>
                    <div class="submit-btn-glow"></div>
                    <span class="btn-shine"></span>
                </button>
            </form>
        </div>

    </div>
</div>

<script>
document.getElementById('contact-form')?.addEventListener('submit', function(e) {
    const btn = document.getElementById('submit-btn');
    btn.innerHTML = '<span class="submit-btn-inner"><i class="fas fa-spinner fa-spin"></i> TRANSMITTING...</span>';
    btn.disabled = true;
});
</script>
{% endblock %}
